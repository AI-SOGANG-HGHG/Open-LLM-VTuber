name: Ruff

on:
  push:
    paths:
      - '**/*.py'
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/workflows/ruff.yml
  pull_request:
    paths:
      - '**/*.py'
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/workflows/ruff.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Keep CI, uv.lock, and pre-commit on the same lint baseline.
          version: '0.14.14'
