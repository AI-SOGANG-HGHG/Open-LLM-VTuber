name: Sync Requirements

on:
  push:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/update-requirements.yml

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Export locked version constraints
        run: |
          mkdir -p tmp
          uv export --locked --all-extras --no-hashes --no-emit-project --python 3.12 --output-file tmp/locked-requirements.txt --quiet
      - name: Compile default requirements
        run: uv pip compile pyproject.toml -o requirements.txt --no-deps --universal --python-version 3.10 -c tmp/locked-requirements.txt --no-annotate --no-header
      - name: Compile bilibili requirements
        run: uv pip compile pyproject.toml --extra bilibili -o requirements-bilibili.txt --no-deps --universal --python-version 3.10 -c tmp/locked-requirements.txt --no-annotate --no-header
      - name: Commit updated requirements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update requirements files (bot)"
          file_pattern: |
            requirements.txt
            requirements-bilibili.txt
